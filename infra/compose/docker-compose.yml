services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_agent
      POSTGRES_USER: lead_agent
      POSTGRES_PASSWORD: lead_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_agent -d lead_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_agent:lead_agent@postgres:5432/lead_agent
      REDIS_URL: redis://redis:6379/0
      API_PORT: 8001
      INTEGRATION_PUBLIC_BASE_URL: http://localhost:8001
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_agent:lead_agent@postgres:5432/lead_agent
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "lead_agent.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_agent:lead_agent@postgres:5432/lead_agent
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "lead_agent.worker.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
